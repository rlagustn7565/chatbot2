services:
  - type: web
    name: kakao-chat-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLAUDE_API_KEY
        scope: run
      - key: NAVER_CLIENT_ID
        scope: run
      - key: NAVER_CLIENT_SECRET
        scope: run
